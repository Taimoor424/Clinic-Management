{% extends "base/base.html" %}

{% block content %}
<section class="py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <div class="card shadow rounded-3 p-4">
          <h4 class="mb-4 fw-bold text-center">Your Health Support</h4>

          <form method="post">
            {% csrf_token %}
            <div class="mb-3">
              <label for="symptom" class="form-label">Enter your symptoms:</label>
              <textarea name="symptom" class="form-control" id="symptom" rows="4" placeholder="e.g., I have a headache and sore throat."></textarea>
            </div>
            <div class="text-center">
              <button type="submit" class="btn btn-primary px-4">Check</button>
            </div>
          </form>

          {% if response_text %}
          <hr>
          <div class="mt-4">
            <h5 class="fw-semibold">Bot Response:</h5>
            <div class="alert alert-info">
              {{ response_text|linebreaks }}
            </div>
          </div>
          {% endif %}
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
