{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="format-detection" content="telephone=no,email=no,address=no">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background-color: #fff;
    }

    .login-card {
      max-width: 460px;
      width: 100%;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 2rem;
      background-color: white;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .login-card h1 {
      font-size: 1.5rem;
      margin-bottom: 1rem;
      font-weight: 600;
      text-align: center;
    }

    .login-card .btn-primary {
      background-color: rgb(85, 178, 214);
      border-color: rgb(85, 178, 214);
      color: #111;
      font-weight: 500;
    }

    .login-card .btn-primary:hover {
      background-color: rgb(184, 244, 252);
      border-color: rgb(184, 244, 252);
    }

    .login-footer {
      font-size: 0.85rem;
      text-align: center;
      margin-top: 2rem;
      color: #555;
    }

    .login-footer a {
      color: #0066c0;
      text-decoration: none;
      margin: 0 0.5rem;
    }

    .login-footer a:hover {
      text-decoration: underline;
    }

    .full-width-line {
      width: 100%;
      height: 1px;
      background-color: #ddd;
      margin: 2rem 0;
    }
  </style>
</head>

<body class="d-flex flex-column justify-content-center align-items-center vh-100">

  <!-- Logo -->
  <a href="{% url 'base:home' %}">
    <img src="{% static 'img/logo.png' %}" alt="Logo" class="mb-3" style="max-width: 276px;">
  </a>

  <!-- Password Reset Card -->
  <div class="login-card text-center">
    <div class="mb-3">
      <h1 class="fw-bold">Reset Password</h1>
      <p>Enter your registered email to receive a reset link.</p>
    </div>

    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-{{ message.tags }} alert-dismissible fade show text-start" role="alert">
          {{ message }}
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
      {% endfor %}
    {% endif %}

    <form method="POST" class="text-start">
      {% csrf_token %}

      <div class="mb-3">
        <label for="email" class="form-label">Email address</label>
        <input type="email" name="email" class="form-control" required>
      </div>

      <div class="d-grid">
        <button type="submit" class="btn btn-primary">Send Reset Link</button>
      </div>
    </form>
  </div>

  <!-- Line -->
  <div class="full-width-line"></div>

  <!-- Footer -->
  <div class="login-footer">
    <a href="{% url 'base:home' %}">Home</a>
    <a href="{% url 'base:contact_view' %}">Contact Us</a>
    <a href="{% url 'base:about' %}">About Us</a>
    <div class="mt-2">© 2025 Hanisha Homeo Clinic</div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
